<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오늘의 사주 — Javis</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
:root {
  --gold:#c9a84c; --gold-l:#f0d080; --gold-d:#8b5e1a;
  --bg:#07040f; --card:rgba(255,255,255,0.045);
  --border:rgba(201,168,76,0.22); --text:rgba(232,224,208,0.9);
  --text-dim:rgba(232,224,208,0.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ── 배경 ── */
.bg-stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-stars::before,.bg-stars::after{content:'';position:absolute;inset:0;}
.bg-stars::before{
  background:radial-gradient(ellipse at 15% 40%,rgba(100,60,200,.18) 0%,transparent 55%),
             radial-gradient(ellipse at 85% 15%,rgba(60,30,140,.22) 0%,transparent 50%),
             radial-gradient(ellipse at 50% 95%,rgba(160,100,20,.12) 0%,transparent 45%);
}
.bg-stars::after{
  background-image:
    radial-gradient(1px 1px at 8% 12%,rgba(255,255,255,.85) 0%,transparent 100%),
    radial-gradient(1px 1px at 22% 35%,rgba(255,255,220,.7) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 38% 8%,rgba(255,255,255,.9) 0%,transparent 100%),
    radial-gradient(1px 1px at 52% 55%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 67% 22%,rgba(255,255,220,.75) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 83% 70%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 12% 78%,rgba(255,255,255,.55) 0%,transparent 100%),
    radial-gradient(1px 1px at 91% 42%,rgba(255,255,220,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 33% 88%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 58% 92%,rgba(255,255,220,.65) 0%,transparent 100%),
    radial-gradient(1px 1px at 75% 5%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 4% 52%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 46% 68%,rgba(255,255,220,.55) 0%,transparent 100%),
    radial-gradient(1px 1px at 96% 88%,rgba(255,255,255,.45) 0%,transparent 100%);
}

/* ── 모달 ── */
.modal-wrap{position:fixed;inset:0;z-index:200;background:rgba(4,2,10,.95);display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-wrap.hide{display:none;}
.modal{
  background:linear-gradient(150deg,#0e0820,#160b2c,#0e0820);
  border:1px solid var(--border);border-radius:28px;
  padding:36px 28px;max-width:400px;width:100%;
  box-shadow:0 0 80px rgba(100,60,200,.25),0 0 160px rgba(201,168,76,.08);
  text-align:center;
}
.modal .m-icon{font-size:60px;display:block;margin-bottom:14px;animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.modal h2{font-family:'Noto Serif KR',serif;font-size:21px;color:var(--gold-l);margin-bottom:8px;}
.modal .m-desc{font-size:13px;color:var(--text-dim);line-height:1.7;margin-bottom:26px;}
.field{margin-bottom:14px;text-align:left;}
.field label{display:block;font-size:11px;color:var(--gold);letter-spacing:.8px;margin-bottom:5px;text-transform:uppercase;}
.field input,.field select{
  width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);
  border-radius:12px;padding:12px 15px;color:var(--text);
  font-size:15px;font-family:'Noto Sans KR',sans-serif;outline:none;
  transition:border-color .2s,box-shadow .2s;
  -webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12);}
.field select option{background:#160b2c;}
.btn-go{
  width:100%;margin-top:6px;padding:14px;
  background:linear-gradient(135deg,var(--gold-d),var(--gold),var(--gold-d));
  background-size:200% 100%;border:none;border-radius:14px;
  color:#07040f;font-weight:700;font-size:15px;
  font-family:'Noto Sans KR',sans-serif;cursor:pointer;
  transition:background-position .4s,transform .1s,box-shadow .2s;
  box-shadow:0 4px 20px rgba(201,168,76,.3);
}
.btn-go:hover{background-position:100% 0;box-shadow:0 6px 28px rgba(201,168,76,.45);}
.btn-go:active{transform:scale(.98);}
</style>
</head>
<body>
<div class="bg-stars"></div>

<!-- 모달 -->
<div class="modal-wrap" id="modal">
  <div class="modal">
    <span class="m-icon">🔮</span>
    <h2>오늘의 사주풀이</h2>
    <p class="m-desc">생년월일과 태어난 시간을 입력하면<br>매일 자동으로 사주를 풀어드려요.<br>한 번만 입력하면 기억합니다.</p>
    <div class="field"><label>이름</label><input type="text" id="i-name" placeholder="이름" value="이동언"></div>
    <div class="field"><label>생년월일</label><input type="date" id="i-birth" value="1981-12-17"></div>
    <div class="field"><label>태어난 시</label>
      <select id="i-hour">
        <option value="0">자시 (子) 23:00 – 01:00</option>
        <option value="1">축시 (丑) 01:00 – 03:00</option>
        <option value="2">인시 (寅) 03:00 – 05:00</option>
        <option value="3">묘시 (卯) 05:00 – 07:00</option>
        <option value="4">진시 (辰) 07:00 – 09:00</option>
        <option value="5">사시 (巳) 09:00 – 11:00</option>
        <option value="6">오시 (午) 11:00 – 13:00</option>
        <option value="7" selected>미시 (未) 13:00 – 15:00</option>
        <option value="8">신시 (申) 15:00 – 17:00</option>
        <option value="9">유시 (酉) 17:00 – 19:00</option>
        <option value="10">술시 (戌) 19:00 – 21:00</option>
        <option value="11">해시 (亥) 21:00 – 23:00</option>
      </select>
    </div>
    <button class="btn-go" onclick="saveAndRender()">✨ 나의 사주 보기</button>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app" style="display:none;position:relative;z-index:1;max-width:480px;margin:0 auto;padding:20px 16px 60px;">

  <!-- 헤더 -->
  <div style="text-align:center;padding:28px 0 22px;">
    <div id="hdr-animal" style="font-size:64px;display:block;margin-bottom:10px;"></div>
    <h1 style="font-family:'Noto Serif KR',serif;font-size:24px;font-weight:700;
      background:linear-gradient(135deg,var(--gold),var(--gold-l),var(--gold));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;">오늘의 사주</h1>
    <div style="font-size:12px;color:var(--text-dim);letter-spacing:1.5px;">JAVIS · 사주팔자 분석</div>
  </div>

  <!-- 날짜 배지 -->
  <div id="date-badge" style="display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--card);border:1px solid var(--border);border-radius:50px;
    padding:9px 20px;margin:0 auto 20px;width:fit-content;
    font-size:13px;color:var(--gold-l);"></div>

  <!-- 프로필 -->
  <div style="display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:18px;">
    <div id="p-avatar" style="font-size:38px;"></div>
    <div style="flex:1;">
      <div id="p-name" style="font-size:16px;font-weight:500;color:var(--gold-l);"></div>
      <div id="p-birth" style="font-size:12px;color:var(--text-dim);margin-top:3px;"></div>
    </div>
    <button onclick="reset()" style="font-size:11px;color:var(--text-dim);background:none;
      border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;
      font-family:'Noto Sans KR',sans-serif;">재설정</button>
  </div>

  <!-- 기운 배너 -->
  <div style="width:100%;height:150px;border-radius:22px;overflow:hidden;margin-bottom:18px;
    position:relative;background:linear-gradient(135deg,#12082a,#1e0e40,#12082a);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;">
    <div style="position:absolute;font-size:80px;opacity:.07;letter-spacing:16px;
      font-family:'Noto Serif KR',serif;user-select:none;">天地人</div>
    <div style="position:relative;text-align:center;">
      <div id="banner-emoji" style="font-size:54px;display:block;"></div>
      <div id="banner-text" style="font-family:'Noto Serif KR',serif;font-size:14px;
        color:var(--gold-l);margin-top:6px;"></div>
    </div>
    <!-- 별 장식 -->
    <div style="position:absolute;top:12px;left:18px;font-size:10px;color:var(--gold);opacity:.6;">✦</div>
    <div style="position:absolute;top:18px;right:22px;font-size:8px;color:var(--gold);opacity:.4;">✦</div>
    <div style="position:absolute;bottom:14px;left:28px;font-size:7px;color:var(--gold);opacity:.35;">✦</div>
    <div style="position:absolute;bottom:16px;right:16px;font-size:11px;color:var(--gold);opacity:.5;">✦</div>
  </div>

  <!-- 사주 4기둥 -->
  <div style="font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:10px;">🏛 사주팔자 (四柱八字)</div>
  <div id="pillars" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;"></div>

</div>

  <!-- 오행 분석 -->
  <div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;">
    <div style="font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:14px;">🌿 오행 분석 (五行)</div>
    <div id="elements" style="display:flex;flex-direction:column;gap:11px;"></div>
  </div>

  <!-- 오늘의 운세 -->
  <div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;">
    <div style="font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:14px;">✨ 오늘의 운세</div>
    <div id="fortune" style="font-family:'Noto Serif KR',serif;font-size:14px;line-height:2;color:var(--text);"></div>
  </div>

  <!-- 점수 카드 -->
  <div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;">
    <div style="font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:14px;">📊 오늘의 운세 점수</div>
    <div id="scores" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;"></div>
  </div>

  <!-- 오늘의 팁 -->
  <div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;">
    <div style="font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:14px;">💡 오늘의 가이드</div>
    <div id="tips" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;"></div>
  </div>

  <!-- 주간 운세 차트 -->
  <div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <div style="font-size:11px;color:var(--gold);letter-spacing:1px;">📈 주간 운세 차트</div>
      <div style="font-size:10px;color:var(--text-dim);">내일부터 7일간</div>
    </div>
    <!-- 범례 -->
    <div style="display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;">
      <span style="font-size:10px;color:#c9a84c;display:flex;align-items:center;gap:4px;"><span style="display:inline-block;width:18px;height:2px;background:#c9a84c;border-radius:2px;"></span>종합운</span>
      <span style="font-size:10px;color:#7eb8f7;display:flex;align-items:center;gap:4px;"><span style="display:inline-block;width:18px;height:2px;background:#7eb8f7;border-radius:2px;"></span>애정운</span>
      <span style="font-size:10px;color:#7edd9a;display:flex;align-items:center;gap:4px;"><span style="display:inline-block;width:18px;height:2px;background:#7edd9a;border-radius:2px;"></span>재물운</span>
    </div>
    <!-- 캔버스 -->
    <canvas id="week-chart" height="180" style="width:100%;display:block;border-radius:12px;"></canvas>
    <!-- 날짜 라벨 -->
    <div id="week-labels" style="display:grid;grid-template-columns:repeat(7,1fr);margin-top:8px;text-align:center;gap:4px;"></div>
    <!-- 7일 카드 -->
    <div id="week-cards" style="display:flex;flex-direction:column;gap:8px;margin-top:16px;"></div>

  <!-- 별자리 운세 -->
  <div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;">
    <div style="font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:16px;">⭐ 별자리 운세</div>
    <!-- 별자리 헤더 -->
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;
      background:linear-gradient(135deg,rgba(100,60,200,.15),rgba(201,168,76,.08));
      border:1px solid var(--border);border-radius:16px;padding:14px 16px;">
      <div id="z-symbol" style="font-size:44px;line-height:1;"></div>
      <div>
        <div id="z-name" style="font-family:'Noto Serif KR',serif;font-size:18px;color:var(--gold-l);font-weight:700;"></div>
        <div id="z-period" style="font-size:11px;color:var(--text-dim);margin-top:3px;"></div>
        <div id="z-elem" style="font-size:11px;color:var(--gold);margin-top:2px;"></div>
      </div>
    </div>
    <!-- 별자리 운세 텍스트 -->
    <div id="z-fortune" style="font-family:'Noto Serif KR',serif;font-size:14px;line-height:2;color:var(--text);margin-bottom:16px;"></div>
    <!-- 별자리 점수 -->
    <div id="z-scores" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-bottom:16px;"></div>
    <!-- 별자리 팁 -->
    <div style="background:rgba(255,255,255,.025);border-radius:12px;padding:12px 14px;">
      <div id="z-tip" style="font-size:13px;color:var(--text-dim);line-height:1.8;"></div>
    </div>
  </div>

  <!-- 푸터 -->
  <div style="text-align:center;padding-top:10px;">
    <div style="font-size:11px;color:var(--text-dim);">☯ Javis · 오늘도 좋은 하루 되세요</div>
  </div>

</div><!-- /app -->

<script>
// ── 데이터 ──
const STEMS      = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
// ── 주간 운세 차트 ──
const WEEK_MSGS = {
  high:  ['활기차고 긍정적인 에너지가 넘치는 날','주변의 지지와 도움이 강하게 느껴지는 날','결단력이 빛을 발하는 최고의 날'],
  mid:   ['평온하게 흘러가는 무난한 하루','차분하게 내실을 다지기 좋은 날','작은 노력이 쌓이는 안정적인 날'],
  low:   ['에너지를 비축하며 쉬어가는 날','신중함이 필요한 날, 충동적 결정은 금물','내면을 돌아보는 성찰의 시간'],
};
const WEEK_EMOJI = {high:'🔥',mid:'⚡',low:'🌙'};

function renderWeekChart(bd, rand) {
  const days7 = [];
  const now = new Date();
  for (let i = 1; i <= 7; i++) {
    const d = new Date(now);
    d.setDate(now.getDate() + i);
    // 날마다 다른 시드
    const seed = d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
    const r = mkRand(seed * 17 + bd.getTime() % 9973);
    const overall = +(2.5 + r() * 2.5).toFixed(1);
    const love    = +(2.5 + r() * 2.5).toFixed(1);
    const money   = +(2.5 + r() * 2.5).toFixed(1);
    const level   = overall >= 4 ? 'high' : overall >= 3 ? 'mid' : 'low';
    days7.push({date:d, overall, love, money, level});
  }

  // ── 날짜 라벨 ──
  const DAYS = ['일','월','화','수','목','금','토'];
  document.getElementById('week-labels').innerHTML = days7.map(({date})=>`
    <div>
      <div style="font-size:9px;color:var(--text-dim);">${date.getMonth()+1}/${date.getDate()}</div>
      <div style="font-size:10px;color:var(--gold);margin-top:1px;">${DAYS[date.getDay()]}</div>
    </div>`).join('');

  // ── Canvas 차트 ──
  const canvas = document.getElementById('week-chart');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth - 40;
  const H = 180;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const PAD = {top:16, right:16, bottom:12, left:28};
  const cW = W - PAD.left - PAD.right;
  const cH = H - PAD.top  - PAD.bottom;
  const MIN_V = 1, MAX_V = 5;

  function xPos(i) { return PAD.left + (i / 6) * cW; }
  function yPos(v) { return PAD.top + cH - ((v - MIN_V) / (MAX_V - MIN_V)) * cH; }

  // 배경 그리드
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  [1,2,3,4,5].forEach(v => {
    ctx.beginPath(); ctx.moveTo(PAD.left, yPos(v)); ctx.lineTo(PAD.left+cW, yPos(v)); ctx.stroke();
  });

  // Y축 라벨
  ctx.fillStyle = 'rgba(232,224,208,0.35)';
  ctx.font = `${9*dpr/dpr}px sans-serif`;
  ctx.textAlign = 'right';
  [1,2,3,4,5].forEach(v=>{ctx.fillText(v, PAD.left-5, yPos(v)+3);});

  // 선 + 면적 그리기 함수
  function drawLine(vals, color, fillColor) {
    // 면적
    ctx.beginPath();
    ctx.moveTo(xPos(0), yPos(vals[0]));
    vals.forEach((v,i)=>{ if(i>0) ctx.lineTo(xPos(i),yPos(v)); });
    ctx.lineTo(xPos(6), yPos(0)+PAD.top+cH);
    ctx.lineTo(xPos(0), yPos(0)+PAD.top+cH);
    ctx.closePath();
    ctx.fillStyle = fillColor;
    ctx.fill();
    // 선
    ctx.beginPath();
    ctx.moveTo(xPos(0), yPos(vals[0]));
    vals.forEach((v,i)=>{ if(i>0) ctx.lineTo(xPos(i),yPos(v)); });
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();
    // 점
    vals.forEach((v,i)=>{
      ctx.beginPath();
      ctx.arc(xPos(i), yPos(v), 3.5, 0, Math.PI*2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(7,4,15,0.8)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });
  }

  drawLine(days7.map(d=>d.money),  '#7edd9a', 'rgba(126,221,154,0.06)');
  drawLine(days7.map(d=>d.love),   '#7eb8f7', 'rgba(126,184,247,0.06)');
  drawLine(days7.map(d=>d.overall),'#c9a84c', 'rgba(201,168,76,0.10)');

  // 오늘 → 내일 구분선 (없음, 내일부터 시작)
  // 최고점 표시
  const maxIdx = days7.reduce((mi,d,i,a)=>d.overall>a[mi].overall?i:mi,0);
  const maxD = days7[maxIdx];
  ctx.fillStyle = '#f0d080';
  ctx.font = `bold ${10}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(`▲${maxD.overall}`, xPos(maxIdx), yPos(maxD.overall)-8);

  // ── 7일 카드 ──
  document.getElementById('week-cards').innerHTML = days7.map(({date,overall,love,money,level})=>{
    const msgs = WEEK_MSGS[level];
    const msg  = msgs[Math.floor(Math.random()*msgs.length)];
    const emoji= WEEK_EMOJI[level];
    const bar  = (v)=>'█'.repeat(Math.round(v)).padEnd(5,'░');

// ── 사주 계산 ──
function yearPillar(y) {
  return { s:((y-4)%10+10)%10, b:((y-4)%12+12)%12 };
}
function monthPillar(y, m) {
  const ys = ((y-4)%10+10)%10;
  const base = (ys%5)*2;
  return { s:(base+m-1)%10, b:(m+1)%12 };
}
function dayPillar(date) {
  const base = new Date(1900,0,31);
  const diff = Math.floor((date-base)/86400000);
  return { s:((diff%10)+10)%10, b:((diff%12)+12)%12 };
}
function hourPillar(dayStem, hb) {
  return { s:((dayStem%5)*2+Math.floor(hb/2))%10, b:hb%12 };
}
function buildSaju(birthDate, hb) {
  const y=birthDate.getFullYear(), m=birthDate.getMonth()+1;
  const yp=yearPillar(y), mp=monthPillar(y,m), dp=dayPillar(birthDate), hp=hourPillar(dp.s,hb);
  return [
    {label:'연주 (年柱)',...yp},
    {label:'월주 (月柱)',...mp},
    {label:'일주 (日柱)',...dp},
    {label:'시주 (時柱)',...hp},
  ];
}
function todaySaju() {
  const now=new Date();
  const hb=Math.floor(((now.getHours()+1)%24)/2);
  return buildSaju(now,hb);
}
function elemCount(pillars) {
  const c={'목':0,'화':0,'토':0,'금':0,'수':0};
  pillars.forEach(p=>{c[STEM_ELEM[p.s]]++;c[BRANCH_ELEM[p.b]]++;});
  return c;
}

// ── 시드 난수 ──
function mkRand(seed) {
  let s=seed>>>0;
  return ()=>{s=(s*1664525+1013904223)>>>0;return s/0xffffffff;};
}
function todaySeed(birthMs) {
  const d=new Date();
  return (d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())*31+(birthMs%9973);
}

          border-radius:99px;transition:width 1s ease;"></div>
      </div>
      <div style="font-size:12px;color:var(--text-dim);width:16px;text-align:right;">${c}</div>
    </div>`).join('');

  // 운세
  document.getElementById('fortune').innerHTML = fortune.text;

  // 점수
  document.getElementById('scores').innerHTML = fortune.scores.map(s=>`
    <div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:5px;">${s.l}</div>
      <div style="font-size:17px;letter-spacing:2px;">${'⭐'.repeat(s.v)}${'☆'.repeat(5-s.v)}</div>
      <div style="font-size:12px;color:var(--gold);margin-top:3px;">${s.v} / 5</div>
    </div>`).join('');

  // 팁
  document.getElementById('tips').innerHTML = fortune.tips.map(t=>`
    <div style="background:rgba(255,255,255,.03);border:1px solid var(--border);
      border-radius:14px;padding:14px 10px;text-align:center;">
      <span style="font-size:22px;display:block;margin-bottom:4px;">${t.e}</span>
      <div style="font-size:10px;color:var(--text-dim);">${t.l}</div>
      <div style="font-size:13px;color:var(--gold-l);font-weight:500;margin-top:3px;">${t.v}</div>
    </div>`).join('');

  // 주간 운세 차트
  renderWeekChart(bd, mkRand(todaySeed(bd.getTime()) + 3333));

  // 별자리
  renderZodiac(bd, mkRand(todaySeed(bd.getTime()) + 7777));

  document.getElementById('modal').classList.add('hide');
  document.getElementById('app').style.display='block';
}

function saveAndRender() {
  const name  = (document.getElementById('i-name').value||'').trim()||'이동언';
  const birth = document.getElementById('i-birth').value;
  const hour  = document.getElementById('i-hour').value;
  if (!birth) { alert('생년월일을 입력해주세요 🙏'); return; }
  const user = {name, birth, hour};
  try { localStorage.setItem('saju_user', JSON.stringify(user)); } catch(e){}
  render(user);
}

function reset() {
  try { localStorage.removeItem('saju_user'); } catch(e){}
  document.getElementById('modal').classList.remove('hide');
  document.getElementById('app').style.display='none';
}

// ── 기본 사용자 정보 ──
const DEFAULT_USER = { name: '이동언', birth: '1981-12-17', hour: '7' };

// ── 시작 ──
(function(){
  try {
    const s = localStorage.getItem('saju_user');
    if (s) { render(JSON.parse(s)); return; }
  } catch(e){}
  // localStorage 없으면 기본값으로 바로 렌더 (모달 생략)
  render(DEFAULT_USER);
})();
</script>
</body>
</html>

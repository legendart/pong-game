<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #000000;
        }
    </style>
</head>
<body>
    <canvas id="pongCanvas" width="600" height="400"></canvas>
    <div id="scoreBoard" style="color: white; margin-top: 20px; font-size: 24px;">
        Player 1: <span id="score1">0</span> | Player 2: <span id="score2">0</span>
    </div>
    <div id="mobileControls" style="color: white; margin-top: 10px;">
        Touch/Drag to control paddles.
    </div>
    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const score1Element = document.getElementById('score1');
        const score2Element = document.getElementById('score2');
        const mobileControls = document.getElementById('mobileControls');

        const CANVAS_WIDTH = canvas.width;
        const CANVAS_HEIGHT = canvas.height;

        // Game Variables
        let player1Score = 0;
        let player2Score = 0;

        // Paddle Setup
        const paddle1 = {
            x: 10,
            y: CANVAS_HEIGHT / 2 - 50,
            width: 10,
            height: 100,
            dy: 0 // Movement direction
        };
        const paddle2 = {
            x: CANVAS_WIDTH - 20,
            y: CANVAS_HEIGHT / 2 - 50,
            width: 10,
            height: 100,
            dy: 0 // Movement direction
        };

        // Ball Setup
        let ball = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT / 2,
            radius: 10,
            speed: 5,
            dx: 5, // Initial horizontal speed
            dy: 5  // Initial vertical speed
        };

        // Input Handling (Keyboard for Desktop)
        const keysPressed = {};

        document.addEventListener('keydown', (e) => {
            keysPressed[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keysPressed[e.key] = false;
        });

        // Mobile Touch Input Handling
        let touchStartY = null;
        let touchStartX = null;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent default scroll/zoom
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent default scroll/zoom
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            
            const rect = canvas.getBoundingClientRect();
            const relativeX = touchX - rect.left;
            const relativeY = touchY - rect.top;

            // Determine which paddle is being touched based on X position
            if (relativeX < CANVAS_WIDTH / 2) {
                // Touch left half -> Paddle 1
                paddle1.y = relativeY - 50; // Center the touch relative to the paddle area
            } else {
                // Touch right half -> Paddle 2
                paddle2.y = relativeY - 50;
            }
            
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            touchStartX = null;
            touchStartY = null;
        }, { passive: false });

        function updatePaddles() {
            // Reset paddle positions based on drag/touch logic to ensure smooth operation
            // For mobile, the touchmove handler directly sets the Y position.
            
            // Keyboard movement (Desktop fallback)
            if (keysPressed['w']) {
                paddle1.y -= 5;
            }
            if (keysPressed['s']) {
                paddle1.y += 5;
            }
            if (keysPressed['ArrowUp']) {
                paddle2.y -= 5;
            }
            if (keysPressed['ArrowDown']) {
                paddle2.y += 5;
            }

            // Keep paddle 1 within bounds
            paddle1.y = Math.max(0, Math.min(paddle1.y, CANVAS_HEIGHT - paddle1.height));

            // Keep paddle 2 within bounds
            paddle2.y = Math.max(0, Math.min(paddle2.y, CANVAS_HEIGHT - paddle2.height));
        }

        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall Collision (Top/Bottom)
            if (ball.y + ball.radius > CANVAS_HEIGHT || ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }

            // Paddle Collision Detection
            // Paddle 1 collision
            if (ball.x - ball.radius < paddle1.x + paddle1.width && ball.y > paddle1.y && ball.y < paddle1.y + paddle1.height) {
                ball.dx = -ball.dx;
                ball.dx *= -1.05; // Increase speed slightly
            }
            // Paddle 2 collision
            if (ball.x + ball.radius > paddle2.x && ball.y > paddle2.y && ball.y < paddle2.y + paddle2.height) {
                ball.dx = -ball.dx;
                ball.dx *= -1.05; // Increase speed slightly
            }
        }

        function checkScore() {
            // Ball goes off the left side (Player 2 scores)
            if (ball.x < 0) {
                player2Score++;
                score2Element.textContent = player2Score;
                resetBall();
            }
            // Ball goes off the right side (Player 1 scores)
            if (ball.x > CANVAS_WIDTH) {
                player1Score++;
                score1Element.textContent = player1Score;
                resetBall();
            }
        }

        function resetBall() {
            ball.x = CANVAS_WIDTH / 2;
            ball.y = CANVAS_HEIGHT / 2;
            // Reverse direction of the ball slightly after a score for a bit of pause
            ball.dx = -ball.dx * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = Math.abs(Math.random() * 5) - 2.5; // New vertical speed
            ball.speed = 5; // Reset base speed
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1a1a1a'; // Dark background color
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw Center Line (Optional but nice)
            ctx.strokeStyle = '#333333';
            ctx.beginPath();
            ctx.setLineDash([10, 10]);
            ctx.moveTo(CANVAS_WIDTH / 2, 0);
            ctx.lineTo(CANVAS_WIDTH / 2, CANVAS_HEIGHT);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            // Draw Paddles
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(paddle1.x, paddle1.y, paddle1.width, paddle1.height);
            ctx.fillRect(paddle2.x, paddle2.y, paddle2.width, paddle2.height);

            // Draw Ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff0000';
            ctx.fill();
        }

        function gameLoop() {
            updatePaddles();
            updateBall();
            checkScore();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
